name: Build and Push Docker Image

on:
  push:
    branches:
      - prod
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/orpailleur-pilot
  NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}

jobs:
  # ── Garde-fou, avant tout push ────────────────────────────────────────────
  #
  # Ce job existait pas : le workflow construisait et poussait l'image sans
  # jamais lire le code. Une régression de type variable CSS passait donc en
  # production — c'est exactement ce qui est arrivé avec `--color-surface`,
  # 49 fois, et avec `--radius-lg` qui rendait tous les arrondis nuls.
  #
  # Rien de ce que vérifie ce job n'est visible à l'œil nu ni au build : une
  # substitution CSS non résolue est ignorée en silence par le navigateur.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Mêmes options que le Dockerfile, volontairement. Vérifier un arbre
        # différent de celui qu'on embarque ne prouverait rien : le
        # `--legacy-peer-deps` n'est pas cosmétique, sans lui `npm ci` échoue
        # sur ce lock (picomatch), alors que le build de l'image passe.
        run: npm ci --legacy-peer-deps

      - name: Types
        run: npm run typecheck

      - name: Variables CSS
        run: npm run check:tokens

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          TAG=${GITHUB_REF#refs/tags/}

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "prod" ]]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
            echo "VERSION=${LATEST_TAG}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=prod-${LATEST_TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          pull: true
          # NEXT_PUBLIC_* est fige au build dans le bundle client : sans ce
          # build-arg, l image embarque l ARG par defaut du Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.ENVIRONMENT }}-latest

      - name: Image digest
        run: echo "Image pushed - ${{ steps.meta.outputs.IMAGE_TAG }} and ${{ steps.meta.outputs.ENVIRONMENT }}-latest"
