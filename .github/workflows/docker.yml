name: Build and Push Docker Image

on:
  push:
    branches:
      - prod
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/orpailleur-pilot
  NEXT_PUBLIC_API_URL: ${{ secrets.PROD_API_URL }}

jobs:
  # ── Garde-fou, avant tout push ────────────────────────────────────────────
  #
  # Ce job existait pas : le workflow construisait et poussait l'image sans
  # jamais lire le code. Une régression de type variable CSS passait donc en
  # production — c'est exactement ce qui est arrivé avec `--color-surface`,
  # 49 fois, et avec `--radius-lg` qui rendait tous les arrondis nuls.
  #
  # Rien de ce que vérifie ce job n'est visible à l'œil nu ni au build : une
  # substitution CSS non résolue est ignorée en silence par le navigateur.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Mêmes options que le Dockerfile, volontairement. Vérifier un arbre
        # différent de celui qu'on embarque ne prouverait rien : le
        # `--legacy-peer-deps` n'est pas cosmétique, sans lui `npm ci` échoue
        # sur ce lock (picomatch), alors que le build de l'image passe.
        run: npm ci --legacy-peer-deps

      - name: Types
        run: npm run typecheck

      - name: Variables CSS
        run: npm run check:tokens

  # ── Les tests d'interface ────────────────────────────────────────────────
  #
  # Ce job ne construit rien : il vérifie que les ÉCRANS fonctionnent.
  #
  # Un test qui lit une page ne prouve pas qu'elle marche : une page peut
  # s'afficher ET planter en silence. Le passage complet a trouvé, en une
  # exécution, une dozen de clés de traduction brutes affichées à l'écran
  # (« all_statuses », « invoice_paid »…), une URL d'avatar servie en HTTP
  # sur une page HTTPS, et un lien « Retour » vers une route inexistante.
  #
  # Le garde-fou des traductions ne demande aucun accès : il lit le code et
  # les messages. Le reste de la suite a besoin d'un compte d'administration ;
  # sans identifiants, les tests sont SAUTÉS (et le job reste vert) plutôt
  # que d'échouer sur une connexion impossible.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Installer le navigateur
        run: npx playwright install --with-deps chromium

      - name: Gardes-fou des traductions
        run: npx playwright test tests/i18n.spec.ts

      - name: Passage sur chaque écran
        env:
          PILOT_BASE_URL: ${{ vars.PILOT_BASE_URL || 'https://pilot.orpailleur-software.fr' }}
          PILOT_EMAIL: ${{ secrets.E2E_PILOT_EMAIL }}
          PILOT_PASSWORD: ${{ secrets.E2E_PILOT_PASSWORD }}
        run: npx playwright test

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          TAG=${GITHUB_REF#refs/tags/}

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "prod" ]]; then
            # SHA court comme tag unique : chaque push rewrite l'image sous
            # prod-latest, et Docker Hub detecte un nouveau digest.
            echo "VERSION=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=prod-${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          pull: true
          # NEXT_PUBLIC_* est fige au build dans le bundle client : sans ce
          # build-arg, l image embarque l ARG par defaut du Dockerfile.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.ENVIRONMENT }}-latest

      - name: Image digest
        run: echo "Image pushed - ${{ steps.meta.outputs.IMAGE_TAG }} and ${{ steps.meta.outputs.ENVIRONMENT }}-latest"
