<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Orpailleur">
  <!-- Brand mark: a boule de boulanger stylised, with the "O" counterform.
       Solid single colour so it stays legible on both light and dark browser
       chrome and does not depend on theme CSS variables, which favicons
       cannot read. -->
  <rect width="64" height="64" rx="14" fill="#B45309"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#FFF7ED" stroke-width="6"/>
  <path d="M32 17v30" stroke="#FFF7ED" stroke-width="5" stroke-linecap="round"/>
</svg>